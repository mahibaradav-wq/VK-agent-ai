services:
  postgres:
    image: postgres:16
    container_name: polka-postgres
    environment:
      POSTGRES_USER: polka
      POSTGRES_PASSWORD: polka_dev_password
      POSTGRES_DB: polka_social
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka -d polka_social"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
