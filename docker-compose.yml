services:
  postgres:
    image: postgres:16
    container_name: polka-postgres
    environment:
      POSTGRES_USER: polka
      POSTGRES_PASSWORD: polka_dev_password
      POSTGRES_DB: polka_social
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka -d polka_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: polka-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: polka
      MINIO_ROOT_PASSWORD: polka_s3_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
