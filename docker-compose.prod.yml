services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-polka_social}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polka} -d ${POSTGRES_DB:-polka_social}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - polka

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: polka-social:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      AUTH_URL: ${AUTH_URL:-${NEXT_PUBLIC_SITE_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-polka}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polka_social}
      LOCAL_STORAGE_DIR: /app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - polka

  worker:
    image: polka-social:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      AUTH_URL: ${AUTH_URL:-${NEXT_PUBLIC_SITE_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-polka}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polka_social}
      LOCAL_STORAGE_DIR: /app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
    command: ["npx", "tsx", "src/server/queue/worker.ts"]
    networks:
      - polka

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - polka

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  polka:
