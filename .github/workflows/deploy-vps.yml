# Production GitHub deploy is disabled until the owner separately re-enables it.
# This workflow must never open a remote shell, never rebuild production
# services, and never bypass scripts/vps-pull.sh (backup, checkout, migrate, health-check).

name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      note:
        description: Disabled. Production deploy requires a separate owner decision and scripts/vps-pull.sh on the VPS.
        required: true

jobs:
  refuse:
    name: Deploy VPS is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Refuse every dispatch
        run: |
          echo "GitHub Deploy VPS is disabled." >&2
          echo "It previously opened a remote shell and rebuilt production services, skipping backup and migrate." >&2
          echo "After an owner decision, run bash scripts/vps-pull.sh --plan then --apply on the VPS." >&2
          exit 1
